<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A43">
<title>Campus Route Finder</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="campus">

<!-- pictograms, drawn once and reused -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-start" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></symbol>
  <symbol id="i-end" viewBox="0 0 24 24"><path d="M6 21V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M6.5 4h12l-3 4.5 3 4.5h-12z" fill="currentColor"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="2.2" fill="currentColor"/><path d="M12 8.5l-3 4 1 8M12 8.5l3.5 3.5 3 .5M12 8.5l-1.2 5.5 3.7 3 .8 4M9 12.5l-3 .5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-stairs" viewBox="0 0 24 24"><path d="M3 20h5v-5h5v-5h5V5h3" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" fill="none"/></symbol>
  <symbol id="i-elevator" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.5l-3 3.5h6zM12 16.5l-3-3.5h6z" fill="currentColor"/></symbol>
  <symbol id="i-door" viewBox="0 0 24 24"><path d="M14 3H6v18h8" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linejoin="round"/><path d="M10 12h11M17 8l4 4-4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-outdoor" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" fill="currentColor"/><path d="M12 14v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 3v16M7 19l-3.5-3.5M7 19l3.5-3.5M17 21V5M17 5l-3.5 3.5M17 5l3.5 3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-ramp" viewBox="0 0 24 24"><circle cx="10" cy="4" r="2" fill="currentColor"/><path d="M10 7v6h6l2 6M10 9.5H6M13.5 13a5 5 0 1 1-6.5-4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4.5h4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/></symbol>
  <symbol id="i-restroom" viewBox="0 0 24 24"><circle cx="7.5" cy="4.5" r="2" fill="currentColor"/><circle cx="16.5" cy="4.5" r="2" fill="currentColor"/><path d="M5 8.5h5v6.5H8.8V21H6.2v-6H5zM14 8.5h5l-1.5 6.5h-1V21h-1.6v-6H14z" fill="currentColor"/></symbol>
  <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3 4-3 7h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6-5.6 6-10.5A6 6 0 0 0 6 10.5C6 15.4 12 21 12 21z" fill="currentColor"/><circle cx="12" cy="10.5" r="2.2" fill="#fff"/></symbol>
  <symbol id="i-class" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-office" viewBox="0 0 24 24"><path d="M4 21V5l8-2v18M12 7h8v14M4 21h17M7.5 8h1.5M7.5 12h1.5M7.5 16h1.5M15.5 11h1.5M15.5 15h1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-turn" viewBox="0 0 24 24"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z" fill="currentColor"/><path d="M9 15v-3.5h6M12.5 8.5l3 3-3 3" style="stroke:var(--turn-arrow,#fff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1.5M13.5 10H15M9 14h1.5M13.5 14H15M10.5 21v-3h3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M16 21v-8.5a4 4 0 0 0-4-4H5M9.5 4L5 8.5 9.5 13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M8 21v-8.5a4 4 0 0 1 4-4h7M14.5 4L19 8.5 14.5 13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-slight-left" viewBox="0 0 24 24"><path d="M15 21v-7L7.5 6.5M7 12.5V6h6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-slight-right" viewBox="0 0 24 24"><path d="M9 21v-7l7.5-7.5M17 12.5V6h-6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-around" viewBox="0 0 24 24"><path d="M8 21V9a4.5 4.5 0 0 1 9 0v4M13.5 10l3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
</svg>

<!-- the map: two drawings in the same place, only one is shown -->
<main class="map" id="map">
  <section class="pane" id="campusPane" aria-label="Campus map">
    <svg id="campusSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campus map"></svg>
  </section>
  <section class="pane" id="floorPane" aria-label="Floor plan">
    <svg id="floorSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor plan"></svg>
  </section>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</main>

<!-- inside a building: where am I, and the floor picker -->
<div class="bldbar" id="bldBar">
  <button type="button" class="pill-btn" id="toCampus" aria-label="Back to the campus map"><svg><use href="#i-back"/></svg>Campus</button>
  <span class="bld-name" id="floorTitle"></span>
</div>
<div class="floorpick" id="floorChips" role="group" aria-label="Floors"></div>

<!-- map buttons -->
<div class="fabs" id="fabs">
  <button type="button" class="fab" data-zoom="fit" aria-label="Show the whole route" title="Fit"><svg><use href="#i-fit"/></svg></button>
  <div class="zoom-pair">
    <button type="button" class="fab" data-zoom="in" aria-label="Zoom in">+</button>
    <button type="button" class="fab" data-zoom="out" aria-label="Zoom out">&minus;</button>
  </div>
</div>
<button type="button" class="dir-fab" id="dirFab" aria-label="Directions"><svg><use href="#i-turn"/></svg><span>Directions</span></button>

<!-- while walking: the current instruction -->
<div class="nav-banner" id="navBanner" role="status" aria-live="polite" hidden>
  <span class="nb-icon" id="nbIcon"></span>
  <div class="nb-text"><b id="nbText"></b><span id="nbWhere"></span></div>
  <span class="nb-m" id="nbM"></span>
</div>
<div class="nav-bar" id="navBar" hidden>
  <button class="play" id="playBtn" type="button" aria-label="Play the walk"><svg><use href="#i-play"/></svg></button>
  <div class="nav-mid">
    <output id="playInfo"></output>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position along the route">
  </div>
  <button class="nav-exit" id="navExit" type="button">Exit</button>
  <div class="step-ctl" role="group" aria-label="Step by step">
    <button type="button" class="ctl" id="stepPrev" aria-label="Previous step"><svg><use href="#i-prev"/></svg><span>Back</span></button>
    <button type="button" class="ctl" id="stepSay" aria-label="Say this step again"><svg><use href="#i-sound"/></svg><span>Repeat</span></button>
    <button type="button" class="ctl" id="stepNext" aria-label="Next step"><svg><use href="#i-next"/></svg><span>Next</span></button>
  </div>
</div>

<!-- search, directions, the sheet -->
<div class="panel" id="panel">
  <header class="topbar" id="topbar">
    <div class="searchbar" id="searchBox">
      <img class="logo" src="logo.svg" alt="">
      <div class="field grow">
        <input id="qInput" type="text" placeholder="Search rooms, offices, buildings" role="combobox" aria-expanded="false"
               aria-controls="qList" aria-label="Search" spellcheck="false" autocomplete="off">
        <button type="button" class="clear" id="qClear" aria-label="Clear search" hidden><svg><use href="#i-close"/></svg></button>
        <ul class="suggest" id="qList" role="listbox" hidden></ul>
      </div>
      <button class="round-btn mic" id="micBtn" type="button" aria-label="Search by voice" title="Search by voice"><svg><use href="#i-mic"/></svg></button>
      <button class="round-btn" id="voiceBtn" type="button" aria-pressed="false" aria-label="Voice guidance off. Turn on spoken directions" title="Voice guidance"><svg><use href="#i-mute"/></svg></button>
      <button class="round-btn" id="themeBtn" type="button" aria-label="Switch between light and dark" title="Light or dark"><svg><use href="#i-moon"/></svg></button>
    </div>

    <form class="dirbox" id="dirBox" autocomplete="off" hidden>
      <div class="dir-head">
        <button type="button" class="round-btn" id="dirBack" aria-label="Close directions"><svg><use href="#i-back"/></svg></button>
        <div class="modes" role="tablist" aria-label="Route type">
          <button type="button" class="mode" id="modeFast" role="tab" aria-pressed="true"><svg><use href="#i-walk"/></svg>Fastest</button>
          <button type="button" class="mode free" id="modeFree" role="tab" aria-pressed="false"><svg><use href="#i-ramp"/></svg>Step-free</button>
        </div>
        <button class="round-btn mic" id="micBtn2" type="button" aria-label="Say a place by voice" title="Say a place"><svg><use href="#i-mic"/></svg></button>
      </div>
      <div class="dir-fields">
        <div class="dots" aria-hidden="true"><svg class="d-start"><use href="#i-start"/></svg><i></i><i></i><i></i><svg class="d-end"><use href="#i-pin"/></svg></div>
        <div class="dir-inputs">
          <div class="field">
            <input id="fromInput" type="text" placeholder="Choose start" role="combobox" aria-expanded="false"
                   aria-controls="fromList" aria-label="Start" spellcheck="false">
            <button type="button" class="clear" id="fromClear" aria-label="Clear start" hidden><svg><use href="#i-close"/></svg></button>
            <ul class="suggest" id="fromList" role="listbox" hidden></ul>
          </div>
          <div class="field">
            <input id="toInput" type="text" placeholder="Choose destination" role="combobox" aria-expanded="false"
                   aria-controls="toList" aria-label="Destination" spellcheck="false">
            <button type="button" class="clear" id="toClear" aria-label="Clear destination" hidden><svg><use href="#i-close"/></svg></button>
            <ul class="suggest" id="toList" role="listbox" hidden></ul>
          </div>
        </div>
        <button class="round-btn swap" id="swapBtn" type="button" aria-label="Swap start and destination" title="Swap"><svg><use href="#i-swap"/></svg></button>
      </div>
    </form>

    <div class="chips" id="fKinds" role="group" aria-label="Kind of place">
      <label class="chip select"><svg><use href="#i-building"/></svg><select id="fBuilding" aria-label="Building"><option value="">All buildings</option></select></label>
      <label class="chip select" id="fFloorWrap" hidden><select id="fFloor" aria-label="Floor"><option value="">Any floor</option></select></label>
      <button type="button" class="chip" data-kind="class" aria-pressed="false"><svg><use href="#i-class"/></svg>Classrooms</button>
      <button type="button" class="chip" data-kind="room" aria-pressed="false"><svg><use href="#i-office"/></svg>Offices</button>
      <button type="button" class="chip" data-kind="restroom" aria-pressed="false"><svg><use href="#i-restroom"/></svg>Restrooms</button>
      <button type="button" class="chip" data-kind="food" aria-pressed="false"><svg><use href="#i-food"/></svg>Food</button>
      <button type="button" class="chip" data-kind="elevator" aria-pressed="false"><svg><use href="#i-elevator"/></svg>Elevators</button>
      <button type="button" class="chip" data-kind="entrance" aria-pressed="false"><svg><use href="#i-door"/></svg>Entrances</button>
    </div>
  </header>

  <section class="sheet" id="sheet" aria-label="Details">
    <div class="handle" id="handle" role="button" tabindex="0" aria-label="Drag to resize"><i></i></div>
    <div class="sheet-body" id="sheetBody">

      <div class="sec" id="secHome">
        <h2>Explore AUC</h2>
        <p class="sub">Search a room, tap a building to look inside, or try a route.</p>
        <ul class="examples" id="exampleList"></ul>
        <p class="foot" id="sideFoot"></p>
      </div>

      <div class="sec" id="secResults" hidden>
        <div class="sec-head"><h2 id="resTitle">Results</h2><button type="button" class="text-btn" id="fReset">Clear</button></div>
        <ul class="results" id="resList"></ul>
      </div>

      <div class="sec" id="secPlace" hidden>
        <div class="place-head">
          <div><h2 id="plName"></h2><p class="sub" id="plWhere"></p></div>
          <button type="button" class="round-btn" id="plClose" aria-label="Close"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="actions">
          <button type="button" class="act primary" id="plTo"><svg><use href="#i-turn"/></svg>Directions</button>
          <button type="button" class="act" id="plFrom"><svg><use href="#i-start"/></svg>From here</button>
          <button type="button" class="act" id="plShare"><svg><use href="#i-link"/></svg>Share</button>
        </div>
        <p class="about" id="plAbout"></p>
        <h3>Nearby</h3>
        <div class="chips wrap" id="nearChips">
          <button type="button" class="chip" data-find="restroom"><svg><use href="#i-restroom"/></svg>Restroom</button>
          <button type="button" class="chip" data-find="elevator"><svg><use href="#i-elevator"/></svg>Elevator</button>
          <button type="button" class="chip" data-find="food"><svg><use href="#i-food"/></svg>Food</button>
          <button type="button" class="chip" data-find="entrance"><svg><use href="#i-door"/></svg>Exit</button>
        </div>
        <ul class="results" id="found"></ul>
      </div>

      <div class="sec" id="secRoute" hidden>
        <div class="summary">
          <div><div class="big" id="rTime"></div><p class="sub" id="rSub"></p></div>
          <button type="button" class="start-btn" id="startBtn"><svg><use href="#i-play"/></svg>Start</button>
        </div>
        <button type="button" class="text-btn read-all" id="readAll"><svg><use href="#i-sound"/></svg><span>Read all directions aloud</span></button>
        <div class="compare" id="compare"></div>
        <ol class="steps" id="steps"></ol>
        <div class="route-foot">
          <button class="text-btn" id="copyBtn" type="button"><svg><use href="#i-link"/></svg><span>Copy link to this route</span></button>
          <p>Distances are estimates from the floor plans, about 7 cm per plan unit.</p>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </section>
</div>

<div class="tip" id="tip" hidden></div>

<script src="data.js"></script>
<script src="plans.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
